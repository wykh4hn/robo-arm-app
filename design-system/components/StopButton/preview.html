<!-- @dsCard group="Safety" height=200 subtitle="STOP → Đang dừng → Đã dừng; no confirmation, on every tab" -->
<!doctype html>
<html lang="vi">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>StopButton — preview</title></head>
<body>
<div class="rb-demo rb-demo--dark" style="gap: var(--space-6); padding: var(--space-4) var(--space-4) var(--space-5);">
  <div class="rb-demo-cell">
    <p class="rb-demo-label">Mặc định</p>
    <button class="rb-stop" type="button"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" /> <path d="M8 12h8" /></svg>STOP</button>
  </div>
  <div class="rb-demo-cell">
    <p class="rb-demo-label">Đã bấm · chờ xác nhận</p>
    <button class="rb-stop" type="button" data-state="stopping" aria-live="polite"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>Đang dừng…</button>
  </div>
  <div class="rb-demo-cell">
    <p class="rb-demo-label">Có xác nhận (ack)</p>
    <div style="display:flex; gap: var(--space-2); align-items:center;">
      <button class="rb-stop" type="button" data-state="stopped"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" /> <path d="m9 12 2 2 4-4" /></svg>Đã dừng</button>
      <button class="rb-hbtn" type="button"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polygon points="6 3 20 12 6 21 6 3" /></svg>Sẵn sàng</button>
    </div>
  </div>
  <div class="rb-demo-cell">
    <p class="rb-demo-label">Không có ack sau 2 s</p>
    <div style="display:flex; gap: var(--space-3); align-items:center;">
      <button class="rb-stop" type="button" data-state="unconfirmed"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /> <path d="M12 9v4" /> <path d="M12 17h.01" /></svg>Chưa xác nhận dừng</button>
      <span class="rb-stop-note">Dùng nút dừng khẩn cấp vật lý trên robot.</span>
    </div>
  </div>
</div>
</body>
</html>
