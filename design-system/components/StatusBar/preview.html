<!-- @dsCard group="Shell" height=150 width=1440 subtitle="Overall lamp + Connection, Robot, Task, Tracking; time since last message" -->
<!doctype html>
<html lang="vi">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>StatusBar — preview</title></head>
<body>
<div style="display:grid; gap: var(--space-3); padding: var(--space-3) 0; background: var(--bg);">
  <div class="rb-statusbar" role="status" aria-live="polite">
    <span class="rb-chip rb-chip--lamp rb-chip--ok"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" /> <path d="m9 12 2 2 4-4" /></svg>Hệ thống ổn</span>
    <span class="rb-chip" title="Độ trễ web và trạng thái cáp USB tới robot"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 20h.01" /> <path d="M2 8.82a15 15 0 0 1 20 0" /> <path d="M5 12.859a10 10 0 0 1 14 0" /> <path d="M8.5 16.429a5 5 0 0 1 7 0" /></svg><span class="rb-chip__label">Kết nối</span><span class="rb-chip__value">Web <span class="rb-chip__num">12 ms</span> · USB ổn</span></span>
    <span class="rb-chip"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 8V4H8" /> <rect width="16" height="12" x="4" y="8" rx="2" /> <path d="M2 14h2" /> <path d="M20 14h2" /> <path d="M15 13v2" /> <path d="M9 13v2" /></svg><span class="rb-chip__label">Robot</span><span class="rb-chip__value">Đang chạy</span></span>
    <span class="rb-chip"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 17 2 2 4-4" /> <path d="m3 7 2 2 4-4" /> <path d="M13 6h8" /> <path d="M13 12h8" /> <path d="M13 18h8" /></svg><span class="rb-chip__label">Task</span><span class="rb-chip__value"><span class="rb-chip__num">#13</span> Đang tiến tới vịt đỏ <span class="rb-chip__num">8 s</span></span></span>
    <span class="rb-chip"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" /> <line x1="22" x2="18" y1="12" y2="12" /> <line x1="6" x2="2" y1="12" y2="12" /> <line x1="12" x2="12" y1="6" y2="2" /> <line x1="12" x2="12" y1="22" y2="18" /></svg><span class="rb-chip__label">Độ bám lệnh</span><span class="rb-chip__value">Tốt</span></span>
    <span class="rb-statusbar__updated"><svg class="rb-ic rb-ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" /> <polyline points="12 6 12 12 16 14" /></svg>Cập nhật <span class="rb-mono">0,1 s</span> trước</span>
  </div>
  <div class="rb-statusbar" role="status" aria-live="polite">
    <span class="rb-chip rb-chip--lamp rb-chip--critical"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" /> <path d="m15 9-6 6" /> <path d="m9 9 6 6" /></svg>Cần xử lý</span>
    <span class="rb-chip rb-chip--critical"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m19 5 3-3" /> <path d="m2 22 3-3" /> <path d="M6.3 20.3a2.4 2.4 0 0 0 3.4 0L12 18l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4Z" /> <path d="M7.5 13.5 10 11" /> <path d="M10.5 16.5 13 14" /> <path d="m12 6 6 6 2.3-2.3a2.4 2.4 0 0 0 0-3.4l-2.6-2.6a2.4 2.4 0 0 0-3.4 0Z" /></svg><span class="rb-chip__label">Kết nối</span><span class="rb-chip__value">Web <span class="rb-chip__num">14 ms</span> · USB mất</span></span>
    <span class="rb-chip is-stale"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 8V4H8" /> <rect width="16" height="12" x="4" y="8" rx="2" /> <path d="M2 14h2" /> <path d="M20 14h2" /> <path d="M15 13v2" /> <path d="M9 13v2" /></svg><span class="rb-chip__label">Robot</span><span class="rb-chip__value">Không rõ</span></span>
    <span class="rb-chip rb-chip--warn"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 17 2 2 4-4" /> <path d="m3 7 2 2 4-4" /> <path d="M13 6h8" /> <path d="M13 12h8" /> <path d="M13 18h8" /></svg><span class="rb-chip__label">Task</span><span class="rb-chip__value"><span class="rb-chip__num">#14</span> Đã dừng</span></span>
    <span class="rb-chip is-stale"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" /> <line x1="22" x2="18" y1="12" y2="12" /> <line x1="6" x2="2" y1="12" y2="12" /> <line x1="12" x2="12" y1="6" y2="2" /> <line x1="12" x2="12" y1="22" y2="18" /></svg><span class="rb-chip__label">Độ bám lệnh</span><span class="rb-chip__value">—</span></span>
    <span class="rb-statusbar__updated"><span class="rb-tag rb-tag--warn"><svg class="rb-ic rb-ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" /> <polyline points="12 6 12 12 16 14" /></svg>Dữ liệu cũ</span>Cập nhật <span class="rb-mono">3,4 s</span> trước</span>
  </div>
</div>
</body>
</html>
