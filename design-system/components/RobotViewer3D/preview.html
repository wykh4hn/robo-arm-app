    </div>
    <div class="rb-viewport">

    <div class="rb-viewer__legend">

      <span class="rb-legend__item"><span class="rb-key rb-key--dot" style="color:var(--ee-trail)"></span>Vệt đầu kẹp 10 s</span>
      <span class="rb-legend__item"><span class="rb-key rb-key--dash" style="color:var(--planned-path)"></span>Quỹ đạo dự kiến</span>

</html>
