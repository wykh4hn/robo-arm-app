<!-- @dsCard group="Controls" height=210 subtitle="Primary, secondary, quiet, icon, live, disabled" -->
<!doctype html>
<html lang="vi">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div class="rb-demo rb-demo--surface" style="gap: var(--space-5);">
  <div class="rb-demo-cell"><p class="rb-demo-label">Primary</p><button class="rb-btn rb-btn--primary" type="button"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" /> <path d="m21.854 2.147-10.94 10.939" /></svg>Gửi lệnh</button></div>
  <div class="rb-demo-cell"><p class="rb-demo-label">Secondary</p><button class="rb-btn" type="button"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <polyline points="7 10 12 15 17 10" /> <line x1="12" x2="12" y1="15" y2="3" /></svg>Tải log</button></div>
  <div class="rb-demo-cell"><p class="rb-demo-label">Quiet</p><button class="rb-btn rb-btn--quiet" type="button"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /> <path d="M3 3v5h5" /></svg>Đặt lại góc nhìn</button></div>
  <div class="rb-demo-cell"><p class="rb-demo-label">Icon</p><button class="rb-btn rb-btn--icon" type="button" aria-label="Đưa camera lên khung lớn"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9" /> <polyline points="9 21 3 21 3 15" /> <line x1="21" x2="14" y1="3" y2="10" /> <line x1="3" x2="10" y1="21" y2="14" /></svg></button></div>
  <div class="rb-demo-cell"><p class="rb-demo-label">Live / paused</p>
    <div style="display:flex; gap: var(--space-2);">
      <button class="rb-btn rb-btn--live" type="button" aria-pressed="true"><span class="rb-live-dot"></span>Trực tiếp</button>
      <button class="rb-btn" type="button"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polygon points="6 3 20 12 6 21 6 3" /></svg>Trở lại trực tiếp</button>
    </div>
  </div>
  <div class="rb-demo-cell"><p class="rb-demo-label">Disabled + lý do</p>
    <div style="display:grid; gap: 6px; width: 260px;">
      <button class="rb-btn rb-btn--primary rb-btn--lg rb-btn--block" type="button" aria-disabled="true" aria-describedby="why"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" /> <path d="m21.854 2.147-10.94 10.939" /></svg>Gửi lệnh</button>
      <p class="rb-help" id="why" style="margin:0"><svg class="rb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" /> <path d="M12 16v-4" /> <path d="M12 8h.01" /></svg>Đang có task chạy (#13). Đợi task xong hoặc bấm STOP.</p>
    </div>
  </div>
</div>
</body>
</html>
